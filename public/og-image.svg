<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c18"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing radial circles -->
  <circle cx="200" cy="180" r="280" fill="rgba(56, 189, 248, 0.12)" filter="blur(60px)"/>
  <circle cx="1000" cy="450" r="320" fill="rgba(129, 140, 248, 0.12)" filter="blur(80px)"/>

  <!-- Outer Frame -->
  <rect x="50" y="50" width="1100" height="530" rx="24" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>

  <!-- Top bar dots -->
  <circle cx="95" cy="95" r="7" fill="#ff5f56"/>
  <circle cx="118" cy="95" r="7" fill="#ffbd2e"/>
  <circle cx="141" cy="95" r="7" fill="#27c93f"/>
  <text x="180" y="100" font-family="'JetBrains Mono', monospace" font-size="14" fill="#64748b">workspace / sudhanwa-kulkarni / portfolio</text>

  <!-- Main Content -->
  <text x="95" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#38bdf8" letter-spacing="2">PORTFOLIO &amp; WORKSPACE</text>
  <text x="95" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Sudhanwa Kulkarni</text>
  <text x="95" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="url(#cyanGrad)">Full Stack Developer &amp; Software Engineer</text>
  
  <text x="95" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#94a3b8" max-width="800">
    React · TypeScript · Spring Boot · Go · PostgreSQL · Cloud Systems
  </text>

  <!-- Badges footer -->
  <rect x="95" y="490" width="230" height="42" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <circle cx="115" cy="511" r="5" fill="#22c55e"/>
  <text x="130" y="517" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#38bdf8">9+ Production Projects</text>

  <rect x="345" y="490" width="190" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <text x="365" y="517" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#cbd5e1">Interactive IDE Tree</text>

  <rect x="555" y="490" width="180" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <text x="575" y="517" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#cbd5e1">Sub-1s TTFB</text>
</svg>
