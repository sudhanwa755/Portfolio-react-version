<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <!-- Glowing border accent -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.6"/>
  <!-- Stylized Monogram SK -->
  <text x="32" y="41" font-family="'JetBrains Mono', -apple-system, sans-serif" font-size="24" font-weight="800" fill="url(#cyanGrad)" text-anchor="middle" letter-spacing="-1.5" filter="url(#glow)">SK</text>
  <circle cx="50" cy="18" r="3.5" fill="#22c55e" filter="url(#glow)"/>
</svg>
